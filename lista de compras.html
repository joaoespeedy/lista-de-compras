<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="lista de compras.js">
    <link rel="stylesheet" href="lista de compras .css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quicklist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Quicklist</h1>

        <p class="subtitulo">Lista de compras da semana</p>

        <div class="formulario">
            <input
                type="text"
                id="itemInput"
                placeholder="Digite um item"
            >

            <button id="addButton">
                Adicionar
            </button>
        </div>

        <ul id="lista"></ul>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
